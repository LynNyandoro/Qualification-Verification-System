services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qvs
      POSTGRES_USER: qvs
      POSTGRES_PASSWORD: qvs_secret
    volumes:
      - qvs_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qvs -d qvs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_DB: qvs
      POSTGRES_USER: qvs
      POSTGRES_PASSWORD: qvs_secret
      QVS_JWT_SECRET: replace-this-with-a-long-production-secret-key
      QVS_CORS_ORIGINS: http://localhost,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  qvs_data:
